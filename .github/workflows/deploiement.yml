name: Déploiement

on:
  push:
    branches: [main]
  # `make deploy` passe par ici (gh workflow run), pour redeployer sans commit.
  workflow_dispatch:

concurrency:
  # Deux deploiements en parallele sur la meme machine, c'est une pile a moitie
  # remplacee. On attend que le precedent finisse plutot que de l'annuler.
  group: deploiement
  cancel-in-progress: false

env:
  REGISTRE: ghcr.io/${{ github.repository_owner }}
  # L'adresse publique du site, schema compris. Elle vit ici, dans le depot, et non
  # dans une variable de depot invisible : elle se relit en revue, elle change par
  # un commit, et personne n'a de case a cocher quelque part. Une variable
  # `CARBURANT_SITE_URL` definie dans les parametres du depot la remplace si besoin.
  #
  # `sslip.io` resout tout sous-domaine contenant une adresse IP vers cette adresse,
  # sans inscription. Le jour d'un vrai nom de domaine, cette ligne seule change.
  SITE_PAR_DEFAUT: https://carburant.144-24-195-97.sslip.io

jobs:
  images:
    name: Images multi-architecture
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        brique: [api, web, etl]
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Connexion a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et publier carburant-${{ matrix.brique }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/${{ matrix.brique }}.Dockerfile
          # Le VPS Oracle Free Tier peut etre amd64 (micro) ou aarch64 (Ampere A1).
          # On publie les deux : le deploiement n'a pas a savoir.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRE }}/carburant-${{ matrix.brique }}:${{ github.sha }}
            ${{ env.REGISTRE }}/carburant-${{ matrix.brique }}:main
          cache-from: type=gha,scope=${{ matrix.brique }}
          cache-to: type=gha,mode=max,scope=${{ matrix.brique }}

  secrets-presents:
    name: Le VPS est-il configure ?
    runs-on: ubuntu-latest
    outputs:
      pret: ${{ steps.verifier.outputs.pret }}
    steps:
      - id: verifier
        # Le contexte `secrets` n'est pas lisible dans un `if:` de job : on le lit
        # dans une etape, et les jobs suivants dependent de sa sortie. Sans cela,
        # tant que Baptiste n'a pas ajoute les secrets, chaque push afficherait un
        # deploiement en echec.
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_CLE_PRIVEE: ${{ secrets.VPS_CLE_PRIVEE }}
        run: |
          set -eu
          if [ -n "$VPS_HOST" ] && [ -n "$VPS_USER" ] && [ -n "$VPS_CLE_PRIVEE" ]; then
            echo "pret=true" >> "$GITHUB_OUTPUT"
            echo "Les trois secrets du VPS sont presents."
          else
            echo "pret=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploiement ignore : il manque VPS_HOST, VPS_USER ou VPS_CLE_PRIVEE dans les secrets du depot. Les images sont publiees quand meme."
          fi

  deploiement:
    name: Deploiement sur le VPS
    needs: [images, secrets-presents]
    if: needs.secrets-presents.outputs.pret == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: ${{ vars.CARBURANT_SITE_URL || env.SITE_PAR_DEFAUT }}
    steps:
      - uses: actions/checkout@v5

      - name: Preparer la cle ssh
        env:
          CLE: ${{ secrets.VPS_CLE_PRIVEE }}
          HOTE: ${{ secrets.VPS_HOST }}
        run: |
          set -eu
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$CLE" > ~/.ssh/deploiement
          chmod 600 ~/.ssh/deploiement
          # Pas de `ssh-keyscan`. Il ouvre une connexion par type de cle -- trois --
          # et les referme avant de s'authentifier. fail2ban, dans la configuration
          # par defaut de ces images, compte « Connection closed [preauth] » comme
          # un echec : trois d'un coup suffisent a faire bannir le runner. C'est ce
          # qu'on observait le 25/11/2026 -- la premiere connexion passait, les
          # suivantes expiraient quelques secondes plus tard.
          #
          # `accept-new` fait le meme travail sans connexion supplementaire : la cle
          # est enregistree au premier contact, et un changement ulterieur est
          # refuse, contrairement a `StrictHostKeyChecking=no`.
          #
          # `ControlMaster` va plus loin : les six commandes du deploiement passent
          # dans une seule connexion TCP au lieu de six. Moins de bruit pour
          # fail2ban, et c'est aussi plus rapide.
          {
            echo 'Host deploiement-carburant'
            echo "  HostName $HOTE"
            echo "  User ${{ secrets.VPS_USER }}"
            echo '  IdentityFile ~/.ssh/deploiement'
            echo '  IdentitiesOnly yes'
            echo '  StrictHostKeyChecking accept-new'
            echo '  ConnectTimeout 15'
            echo '  ServerAliveInterval 15'
            echo '  ServerAliveCountMax 4'
            echo '  ControlMaster auto'
            echo '  ControlPath ~/.ssh/cm-%r@%h:%p'
            echo '  ControlPersist 10m'
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Attendre que le VPS reponde
        # Mesure du 25/11/2026 : deux deploiements lances a une minute d'intervalle,
        # le premier se connecte, le second expire. La liaison vers cette instance
        # Oracle est intermittente. Dix essais espaces de quinze secondes valent
        # mieux qu'un echec sec, et le journal dit combien il en a fallu.
        run: |
          set -eu
          for essai in $(seq 1 10); do
            if ssh deploiement-carburant 'echo pret' 2>/dev/null; then
              echo "Connecte au bout de $essai essai(s)."
              exit 0
            fi
            echo "Essai $essai : pas de reponse, nouvelle tentative dans 15 s."
            sleep 15
          done
          echo "::error::Le VPS n'a pas repondu sur le port 22 en dix essais."
          exit 1

      - name: Copier la configuration sur le VPS
        env:
          HOTE: ${{ secrets.VPS_HOST }}
          UTILISATEUR: ${{ secrets.VPS_USER }}
        run: |
          set -eu
          # /opt appartient a root : il faut sudo pour y creer le repertoire, puis
          # le donner a l'utilisateur pour que scp puisse y ecrire sans sudo.
          ssh deploiement-carburant \
            'sudo mkdir -p /opt/carburant/infra/caddy && sudo chown -R "$USER:$USER" /opt/carburant'
          scp compose.prod.yaml infra/scripts/sur-le-vps.sh infra/scripts/preparer-le-vps.sh \
            deploiement-carburant:/opt/carburant/
          scp infra/caddy/Caddyfile deploiement-carburant:/opt/carburant/infra/caddy/Caddyfile
          ssh deploiement-carburant 'chmod +x /opt/carburant/*.sh'

      - name: Preparer le VPS
        # Docker, pare-feu de l'instance, swap si la machine est petite, et le .env
        # (dont le mot de passe de la base, tire au sort sur place et jamais
        # ailleurs). Idempotent : rejoue a chaque deploiement sans rien casser.
        env:
          HOTE: ${{ secrets.VPS_HOST }}
          UTILISATEUR: ${{ secrets.VPS_USER }}
        run: |
          set -eu
          url='${{ vars.CARBURANT_SITE_URL || env.SITE_PAR_DEFAUT }}'
          echo "Site : $url"
          ssh deploiement-carburant \
            "SITE_URL='$url' IP_PUBLIQUE='$HOTE' bash /opt/carburant/preparer-le-vps.sh"

      - name: Authentifier le VPS aupres de GHCR
        env:
          HOTE: ${{ secrets.VPS_HOST }}
          UTILISATEUR: ${{ secrets.VPS_USER }}
          JETON: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          # Le jeton passe par l'entree standard de la commande distante : il
          # n'apparait ni dans la ligne de commande, ni dans `ps` sur le VPS. Il
          # expire a la fin de ce job.
          printf '%s' "$JETON" | ssh deploiement-carburant \
            "sudo docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

      - name: Deployer
        env:
          HOTE: ${{ secrets.VPS_HOST }}
          UTILISATEUR: ${{ secrets.VPS_USER }}
        run: |
          set -eu
          ssh deploiement-carburant \
            "REGISTRE='${{ env.REGISTRE }}' TAG='${{ github.sha }}' bash /opt/carburant/sur-le-vps.sh"

      - name: Essai depuis l'exterieur
        env:
          HOTE: ${{ secrets.VPS_HOST }}
        run: |
          set -eu
          url='${{ vars.CARBURANT_SITE_URL || env.SITE_PAR_DEFAUT }}'
          # Depuis le runner, donc par le vrai chemin public : reseau, pare-feu,
          # Caddy, et TLS le jour ou il y en aura.
          code=$(curl -sS -o /tmp/accueil.html -w '%{http_code}' "$url/")
          echo "GET $url/ -> $code"
          test "$code" = 200
          grep -q 'Où faire le plein' /tmp/accueil.html
          sante=$(curl -sS "$url/v1/sante")
          echo "/v1/sante -> $sante"
          printf '%s' "$sante" | grep -q '"statut"'

      - name: Effacer la cle
        if: always()
        run: |
          ssh -O exit deploiement-carburant 2>/dev/null || true
          rm -f ~/.ssh/deploiement ~/.ssh/config ~/.ssh/cm-*
