name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Les versions sont decidees dans docs/decisions.md et verifiees ici.
  PYTHON_VERSION: '3.14'
  NODE_VERSION: '26'

jobs:
  python:
    name: Python — lint, typage, tests
    runs-on: ubuntu-latest
    services:
      db:
        # Les tests d'integration ont besoin d'un vrai PostGIS : une base simulee
        # ne dirait rien de ST_DWithin ni du partitionnement. Et la meme image que
        # le developpement et la production, pour que les trois disent la meme chose.
        image: imresamu/postgis:18-3.6-alpine
        env:
          POSTGRES_USER: carburant
          POSTGRES_PASSWORD: carburant-ci
          POSTGRES_DB: carburant
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U carburant -d carburant"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://carburant:carburant-ci@localhost:5432/carburant
    steps:
      - uses: actions/checkout@v5

      - name: Installer uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Installer Python ${{ env.PYTHON_VERSION }}
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Synchroniser le workspace
        run: uv sync --all-packages --frozen

      - name: Verifier la version de Python
        run: |
          uv run python -c "import sys; assert sys.version_info[:2] == (3, 14), sys.version"

      - name: Lint
        run: uv run ruff check .

      - name: Formatage
        run: uv run ruff format --check .

      - name: Typage strict
        run: uv run mypy --strict etl api mcp

      - name: Tests
        run: uv run pytest

      - name: Tests d'integration
        # Contre le vrai service PostGIS du job : une base simulee ne dirait rien de
        # COPY, des contraintes CHECK, du jsonb ni des transactions.
        run: uv run pytest -m integration

  front:
    name: Front — lint, typage, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          # Le package.json est dans web/, pas a la racine : sans cette ligne
          # l'action ne trouve pas le champ `packageManager` et s'arrete sur
          # « No pnpm version is specified ». On evite ainsi de redeclarer la
          # version de pnpm ici, ou elle divergerait tot ou tard.
          package_json_file: web/package.json

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Installer les dependances
        run: pnpm install --frozen-lockfile

      - name: Verifier qu'aucune librairie de composants n'est entree dans l'arbre
        # docs/specs/web.md les interdit : c'est la premiere source de l'air
        # « genere ». On le verifie a chaque execution, pas seulement a la revue.
        run: |
          set -eu
          interdits='@nuxt/ui|vuetify|primevue|shadcn-vue|tailwindcss|element-plus|quasar'
          if pnpm ls --depth Infinity --json \
             | grep -oE "\"($interdits)\"" | sort -u | grep . ; then
            echo "::error::Une librairie de composants interdite est presente."
            exit 1
          fi
          echo "Aucune librairie de composants interdite."

      - name: Lint
        run: pnpm lint

      - name: Formatage
        run: pnpm format:check

      - name: Typage
        run: pnpm typecheck

      - name: Tests unitaires
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Budget JS de l'accueil
        # docs/specs/web.md : <= ~100 Ko gzip hors carte et 3D.
        run: |
          set -eu
          total=0
          for f in $(find .output/public/_nuxt -name '*.js'); do
            total=$((total + $(gzip -c "$f" | wc -c)))
          done
          ko=$((total / 1024))
          echo "JS client total : ${ko} Ko gzip"
          if [ "$ko" -gt 140 ]; then
            echo "::error::Budget JS depasse : ${ko} Ko gzip (plafond 140 toutes pages)."
            exit 1
          fi

  contrat:
    name: Contrat — OpenAPI et client TypeScript a jour
    runs-on: ubuntu-latest
    # Le client TypeScript du front et les schemas du serveur MCP sont **generes**
    # depuis l'OpenAPI. Un endpoint ajoute sans regenerer laisse le front typer
    # contre un contrat perime : le compilateur dit oui, l'appel echoue a l'execution.
    # On regenere ici et on exige que rien ne bouge.
    steps:
      - uses: actions/checkout@v5

      - name: Installer uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Installer Python ${{ env.PYTHON_VERSION }}
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Synchroniser le workspace
        run: uv sync --all-packages --frozen

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Installer les dependances du front
        run: cd web && pnpm install --frozen-lockfile

      - name: Regenerer le contrat
        run: make client-api

      - name: Exiger qu'il soit identique a celui du depot
        run: |
          set -eu
          if ! git diff --exit-code -- web/openapi.json web/app/api/genere/; then
            echo "::error::Le contrat d'API a change sans etre regenere. Lancez 'make client-api' et commitez."
            exit 1
          fi
          echo "Contrat a jour."

  infra:
    name: Infra — compose, Caddy, cron
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Un .env issu du modele suffit a demarrer
        # Le modele est le seul mode d'emploi qu'aura Baptiste pour le .env du VPS.
        # S'il manque une variable, c'est ici qu'on l'apprend, pas en production.
        run: cp .env.example .env

      - name: La pile de developpement est coherente
        run: docker compose config --quiet

      - name: La pile de production est coherente
        run: docker compose -f compose.prod.yaml config --quiet
        env:
          CARBURANT_DOMAINE: carburant.exemple.fr

      - name: Le Caddyfile est valide et bien formate
        # Une directive mal formee ne se voit qu'au demarrage de Caddy, donc en
        # production. Le 24/11/2026, une variable d'environnement vide produisait un
        # `email` sans argument et Caddy redemarrait en boucle : c'est ce que cette
        # etape attrape.
        run: |
          set -eu
          docker run --rm -v "$PWD/infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e CARBURANT_DOMAINE=carburant.exemple.fr \
            caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          difference=$(docker run --rm -v "$PWD/infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10-alpine caddy fmt --diff /etc/caddy/Caddyfile)
          if printf '%s' "$difference" | grep -qE '^[-+]'; then
            echo "::error::Caddyfile mal formate. Lancer : caddy fmt --overwrite infra/caddy/Caddyfile"
            printf '%s\n' "$difference"
            exit 1
          fi

      - name: La table de planification est valide
        # Meme version et meme empreinte que dans infra/docker/etl.Dockerfile : si
        # l'une bouge sans l'autre, cette etape le dit.
        env:
          VERSION: '0.2.51'
          EMPREINTE: cc232108374e8e2b537045f2d5eaa1229f619db314c3ba6a14d38b35dc0aa123
        run: |
          set -eu
          grep -q "SUPERCRONIC_VERSION=$VERSION" infra/docker/etl.Dockerfile
          grep -q "$EMPREINTE" infra/docker/etl.Dockerfile
          curl -fsSL -o supercronic \
            "https://github.com/aptible/supercronic/releases/download/v$VERSION/supercronic-linux-amd64"
          echo "$EMPREINTE  supercronic" | sha256sum -c -
          chmod +x supercronic
          ./supercronic -test infra/cron/carburant.cron

  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --all-packages --frozen
      - uses: pnpm/action-setup@v4
        with:
          # Le package.json est dans web/, pas a la racine : sans cette ligne
          # l'action ne trouve pas le champ `packageManager` et s'arrete sur
          # « No pnpm version is specified ». On evite ainsi de redeclarer la
          # version de pnpm ici, ou elle divergerait tot ou tard.
          package_json_file: web/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: cd web && pnpm install --frozen-lockfile
      - run: uv run pre-commit run --all-files --show-diff-on-failure
