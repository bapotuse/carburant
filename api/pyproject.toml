[project]
name = "carburant-api"
version = "0.1.0"
description = "API publique des prix des carburants en France"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.165.0",
    "pydantic>=2.14.4",
    "sqlalchemy>=2.1.9",
    "psycopg[binary,pool]>=3.3.9",
    "psycopg-pool>=3.3.0",
    "httpx>=0.28.1",
    "uvicorn[standard]>=0.40.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/carburant_api"]
# `py.typed` declare que le paquet est type : sans ce marqueur, mypy refuse
# d'utiliser ses annotations depuis un autre paquet du workspace (PEP 561).
artifacts = ["src/*/py.typed"]
