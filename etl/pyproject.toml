[project]
name = "carburant-etl"
version = "0.1.0"
description = "Collecte, nettoyage et historisation des prix des carburants en France"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14.4",
    "psycopg[binary,pool]>=3.3.9",
    "sqlalchemy>=2.1.9",
    "lxml>=6.1.3",
]

[project.scripts]
etl = "carburant_etl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/carburant_etl"]
